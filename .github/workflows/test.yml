name: Host tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The host tests compile against stubs, so they need only a C compiler.
      - name: Run host tests
        run: make test
