# SPDX-License-Identifier: GPL-2.0-or-later
name: Tagged firmware release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake jq ninja-build pipx libusb-1.0-0-dev pkg-config
          pipx install qmk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify tag matches VERSION
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Fetch pinned dependencies
        run: make setup
      - name: Test and build release
        run: make test release
      - name: Verify published v1.1.1 checksum
        if: github.ref_name == 'v1.1.1'
        run: grep -Fx '87c6b571836612a5c1233737ec4261e9461699c09926b291ea13208f77357a39  keyball44-vial_right-custom-v1.1.1-41babbb8.uf2' dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/keyball44-vial_right-custom-v*.uf2
            dist/SHA256SUMS
